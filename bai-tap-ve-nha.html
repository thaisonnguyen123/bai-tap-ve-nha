<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><b>Format text <mark>marked</mark></b></h1>
    <p><b>please use only HTML without CSS</b></p>
    <ul>
        <li><b>THIS word is <em>emphasized</em></b></li>
        <li><b>THIS word is <i>italic</i></b></li>
        <li><b>THIS word is <sup>superscripted</sup></b></li>
        <li><b>THIS word is <sub>subscripted</sub></b></li>
        <li><b>THIS word is <ins>inserted</ins></b></li>
        <li><b>THIS word is <del>deleted</del></b></li>
    </ul>
</html>
